<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found | Devyani Jinturkar</title>
<meta name="robots" content="noindex, follow">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#FDFFE4">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--linen:#FDFFE4; --ink:#15120F; --ink-soft:#43442F; --border:#DCE0C0; --rust:#7C3030;}
  *{box-sizing:border-box; margin:0; padding:0}
  body{background:var(--linen); color:var(--ink); font-family:"Inter","Helvetica Neue",Arial,sans-serif; line-height:1.5; min-height:100vh; display:flex; flex-direction:column}
  header{padding:20px clamp(24px,5vw,64px); border-bottom:1px solid var(--border)}
  .word{font-family:"Fraunces",Georgia,serif; font-weight:600; font-size:1.15rem; color:var(--ink); text-decoration:none}
  main{flex:1; display:flex; flex-direction:column; justify-content:center; padding:80px clamp(24px,5vw,64px); max-width:1240px; margin:0 auto; width:100%}
  .eyebrow{font-size:.72rem; letter-spacing:.22em; text-transform:uppercase; color:var(--rust); font-weight:700; margin-bottom:18px}
  h1{font-family:"Fraunces",Georgia,serif; font-weight:600; font-size:clamp(2.4rem,6vw,4rem); line-height:1.05; letter-spacing:-0.015em; margin-bottom:16px}
  p{color:var(--ink-soft); max-width:44ch; margin-bottom:28px}
  .btn{display:inline-flex; align-items:center; gap:.5em; background:var(--rust); color:var(--linen); text-decoration:none; font-size:.8rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; padding:14px 24px; border:1px solid var(--rust)}
  .btn:hover{background:transparent; color:var(--rust)}
  footer{padding:32px clamp(24px,5vw,64px); border-top:1px solid var(--border); color:var(--ink-soft); font-size:.78rem}
  footer a{color:var(--ink)}
</style>
</head>
<body>
<header><a href="/" class="word">Devyani Jinturkar</a></header>
<main>
  <p class="eyebrow">Error 404</p>
  <h1>Page not found.</h1>
  <p>The link may be old or mistyped. Head back to the homepage to find what you need.</p>
  <a href="/" class="btn">Back to homepage &rarr;</a>
</main>
<footer>Social media marketing for founders and small businesses &middot; <a href="mailto:work.with.devyani@gmail.com">work.with.devyani@gmail.com</a></footer>
</body>
</html>
