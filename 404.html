<!DOCTYPE html>

<style>
  :root{--paper:#ffffff; --ink:#0a0a0a; --grey:#8a8a8a; --line:#e7e7e7; --red:#FF5A1F;
    --display:"Archivo","Helvetica Neue",Arial,sans-serif; --sans:"Outfit","Helvetica Neue",Arial,sans-serif}
  *{box-sizing:border-box; margin:0; padding:0}
  ::selection{background:var(--red); color:#fff}
  body{background:var(--paper); color:var(--ink); font-family:var(--sans); line-height:1.5; min-height:100vh; display:flex; flex-direction:column; -webkit-font-smoothing:antialiased}
  header{padding:16px clamp(18px,5vw,48px); border-bottom:1px solid var(--line)}
  .wm{font-family:var(--display); font-weight:800; text-transform:uppercase; letter-spacing:-0.01em; font-size:1rem; color:var(--ink); text-decoration:none}
  main{flex:1; display:flex; flex-direction:column; justify-content:center; padding:clamp(48px,10vh,110px) clamp(18px,5vw,48px); max-width:1240px; margin:0 auto; width:100%}
  .eyebrow{font-weight:500; text-transform:uppercase; letter-spacing:.2em; font-size:.72rem; color:var(--red); margin-bottom:clamp(16px,3vh,28px)}
  h1{font-family:var(--display); font-weight:800; text-transform:uppercase; font-size:clamp(2.9rem,11vw,9rem); line-height:.88; letter-spacing:-0.03em; margin-bottom:clamp(24px,5vh,44px)}
  p{font-weight:300; font-size:clamp(1rem,1.4vw,1.15rem); color:#333; max-width:40ch; margin-bottom:clamp(28px,5vh,40px)}
  .btn{align-self:flex-start; display:inline-flex; align-items:center; gap:.6em; background:var(--red); color:#fff; text-decoration:none; font-weight:600; text-transform:uppercase; letter-spacing:.1em; font-size:.74rem; padding:16px 26px; border:1px solid var(--red); transition:background .2s,color .2s}
  .btn:hover{background:transparent; color:var(--red)}
  footer{background:var(--ink); color:#777; padding:28px clamp(18px,5vw,48px); font-size:.76rem}
  footer a{color:#b9b9b9; text-decoration:none; border-bottom:1px solid var(--red)}
</style>
</head>
