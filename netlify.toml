# Netlify config — devyanijinturkar.com
# Additive only: redirects + headers. Publish dir / build settings left to the
# Netlify UI so the existing deploy pipeline is unchanged.

# --- Canonical host: 301 www -> apex ---
[[redirects]]
  from = "https://www.devyanijinturkar.com/*"
  to = "https://devyanijinturkar.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.devyanijinturkar.com/*"
  to = "https://devyanijinturkar.com/:splat"
  status = 301
  force = true

# --- Cache static assets hard ---
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/Content/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# --- Baseline security headers ---
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
